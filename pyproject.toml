[project]
name = "langgraph-checkpoint-opengauss"
version = "0.1.0"
description = "openGauss checkpoint persistence for LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["langgraph-checkpoint-postgres==3.2.1"]

[dependency-groups]
dev = [
    "deepagents==0.7.23",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-conformance==0.0.2",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "ruff",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11,<4" }

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",        # pycodestyle
    "F",        # Pyflakes
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "I",        # isort
    "PLC0415",  # import-outside-top-level
    "RUF100",   # unused noqa directive
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph_checkpoint_opengauss"]
package-dir = { langgraph_checkpoint_opengauss = "src/langgraph-checkpoint-opengauss" }

[tool.setuptools.package-data]
langgraph_checkpoint_opengauss = ["queries.toml", "schema.sql"]
