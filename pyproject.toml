[project]
name = "langgraph-checkpoint-opengauss"
version = "0.1.0rc1"
description = "openGauss checkpoint and store backends for LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chao Li" }]
keywords = ["langgraph", "opengauss", "checkpoint", "checkpointer", "store", "memory", "pgvector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["langgraph-checkpoint-postgres==3.2.1"]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.2"]

[project.urls]
Homepage = "https://github.com/Onenightcarnival/langgraph-checkpoint-opengauss"
Repository = "https://github.com/Onenightcarnival/langgraph-checkpoint-opengauss"
Issues = "https://github.com/Onenightcarnival/langgraph-checkpoint-opengauss/issues"
Changelog = "https://github.com/Onenightcarnival/langgraph-checkpoint-opengauss/releases"

[dependency-groups]
dev = [
    "deepagents==0.7.23",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-conformance==0.0.2",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "ruff",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11,<4" }

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",        # pycodestyle
    "F",        # Pyflakes
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "I",        # isort
    "PLC0415",  # import-outside-top-level
    "RUF100",   # unused noqa directive
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "langgraph_checkpoint_opengauss",
    "langgraph_checkpoint_opengauss.checkpoint",
    "langgraph_checkpoint_opengauss.store",
]
package-dir = { langgraph_checkpoint_opengauss = "src/langgraph-checkpoint-opengauss" }

[tool.setuptools.package-data]
langgraph_checkpoint_opengauss = ["schema.sql", "session.toml"]
"langgraph_checkpoint_opengauss.checkpoint" = ["*.toml", "*.sql"]
"langgraph_checkpoint_opengauss.store" = ["*.toml", "*.sql"]
